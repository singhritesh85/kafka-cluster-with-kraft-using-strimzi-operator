apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-producer
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-with-kraft
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: kafka-demo-topic
          patternType: literal
        operations:
        - Write
        host: '*'
        type: allow
        host: '*'
        type: allow
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-with-kraft
spec:
  authentication:
    type: tls
  authorization:
    acls:
      - resource:
          type: topic
          name: kafka-demo-topic
          patternType: literal
        operations:
        - Read
        host: '*'
        type: allow
      - resource:
          type: group
          name: kafka-demo-group
          patternType: literal
        operations:
        - Read
        host: '*'
        type: allow
    type: simple
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-ui
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-with-kraft
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # EVERYTHING on topics
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - All
      # EVERYTHING on consumer groups
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
      # Cluster-wide admin operations
      - resource:
          type: cluster
          name: kafka-cluster
        operations:
          - All
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: keda-user
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-with-kraft
spec:
  authentication:
    type: tls
