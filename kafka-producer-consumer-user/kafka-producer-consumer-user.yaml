apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: kafka-producer
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-with-kraft
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: kafka-demo-topic
          patternType: literal
        operation: Write
        host: '*'
        type: allow
        host: '*'
        type: allow
